<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diawise - User Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/sidebar.css">
</head>
<body>
    <div class="dashboard">
        {{template "sidebar" .}}


        <!--Welcome page-->
        <div class="welcomepage">
        <main class="main-content">
            <div class="header">
                <h1>Welcome, {{.Name}}</h1>
                <div class="notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <div class="notification-icon">3</div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3>Blood Sugar</h3>
                        <a href="#">Track</a>
                    </div>
                    <div class="quick-stats">
                        <div class="stat">
                            <span class="stat-value">128</span>
                            <span class="stat-label">mg/dL</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">5.8</span>
                            <span class="stat-label">HbA1c</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: 65%"></div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h3>Diet & Nutrition</h3>
                        <a href="#">Log Meal</a>
                    </div>
                    <div class="quick-stats">
                        <div class="stat">
                            <span class="stat-value">1800</span>
                            <span class="stat-label">Calories</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">45g</span>
                            <span class="stat-label">Carbs</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: 75%"></div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h3>Medications</h3>
                        <a href="#">Manage</a>
                    </div>
                    <div class="quick-stats">
                        <div class="stat">
                            <span class="stat-value">2</span>
                            <span class="stat-label">Pending</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">3</span>
                            <span class="stat-label">Taken</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: 85%"></div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h3>Support Group</h3>
                        <a href="/support">Join</a>
                    </div>
                    <div class="quick-stats">
                        <div class="stat">
                            <span class="stat-value">12</span>
                            <span class="stat-label">Members</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value">3</span>
                            <span class="stat-label">New Posts</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: 55%"></div>
                    </div>
                </div>
            </div>
            </main>
        </div>
        </main>
    </div>

<script src="/static/js/dashboard.js"></script>
    
    <!-- Auth & Router Scripts -->
    <script src="/static/js/router.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/protected-page.js"></script>

    
    <!-- Page Scripts -->
    <script src="/static/js/BloodSugar.js"></script>
    <script src="/static/js/Diet.js"></script>
    <script src="/static/js/MedicationManager.js"></script>
    <script src="/static/js/Support.js"></script>

</body>
</html>
