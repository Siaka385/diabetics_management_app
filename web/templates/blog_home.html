<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diawise - Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/blog_home.css">
</head>
<body>
    <div class="dashboard">
            {{template "sidebar" .}}
            <main class="main-content">
                <div class="header">
                    <h1>DiaWise Blog</h1>
                    <div class="notifications">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <div class="notification-icon">3</div>
                    </div>
                </div>
    
                <div class="support-group-container">
                    <div class="topics-list">
                        {{range .Posts}}
                        <div class="topic-item">
                            <a href="/post/{{.ID}}" class="view-topic-btn" >
                            <div class="topic-thumbnail">
                                <img src="static/images/{{.Image}}" width="100%" height="200" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                    <!-- <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                    <path d="M12 7v6"/>
                                    <path d="M9 10h6"/> -->
                                </img>
                            </div>
                        </a>
                            <div class="topic-content">

                                <div class="topic-title">{{.Title}}</div>
                                <div class="topic-meta">
                                    <span>Started by {{.Author}}</span>
                                    <span>•</span>
                                    <span> Replies</span>
                                    <span>•</span>
                                    <span>{{.Date}}</span>
                                </div>
                            </div>
                            <div class="topic-excerpt" style="display: inline;">{{.Excerpt}}</div>
                            <a href="/post/{{.ID}}" 
                                class="view-topic-btn" 
                                style="display: inline-block; text-align: center; padding: 10px 20px; background-color: #007BFF; color: white; text-decoration: none; border-radius: 5px;">
                                See More
                            </a>
                        </div>
                        {{end}}
                    </div>
    
                    <div class="sidebar-section">
                        <button id="createTopicBtn" class="create-topic-btn">Create New Topic</button>
    
                        <div class="active-discussions">
                            <h3>Active Discussions</h3>
                            <div class="active-topic">
                                <div class="active-topic-icon">💬</div>
                                <div>
                                    <div class="topic-title">Medication Side Effects</div>
                                    <div class="topic-meta">24 new messages</div>
                                </div>
                            </div>
                            <div class="active-topic">
                                <div class="active-topic-icon">🩺</div>
                                <div>
                                    <div class="topic-title">Insulin Pump Questions</div>
                                    <div class="topic-meta">18 new messages</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    
        <div id="createTopicModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create New Topic</h2>
                    <span class="close-modal" id="closeModal">&times;</span>
                </div>
                <form id="createTopicForm">
                    <input type="text" class="modal-input" placeholder="Topic Title" required>
                    <textarea class="modal-input" rows="4" placeholder="Describe your topic..." required></textarea>
                    <button type="submit" class="submit-topic-btn">Create Topic</button>
                </form>
            </div>
        </div>

        <script src="/static/js/blog_home.js"></script>
    </body></html>
