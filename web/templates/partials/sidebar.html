{{define "sidebar"}}
<!-- Sidebar Toggle Button -->
<button class="sidebar-toggle" id="sidebarToggle">
    <span class="toggle-icon">☰</span>
</button>

<!-- Overlay for mobile -->
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <div class="profile">
        <div class="profile-image">{{.Abbrev}}</div>
        <h2>{{.Name}}</h2>
        <div class="edit-profile">✎</div>
    </div>
    <nav>
        <ul class="sidebar-nav">
            <li><a href="/dashboard" class="{{if eq .CurrentPage "/dashboard"}}active{{end}}"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a></li>
            <li><a href="/bloodsugar" class="{{if eq .CurrentPage "/bloodsugar"}}active{{end}}"><span class="nav-icon">📊</span><span class="nav-text">Blood Sugar</span></a></li>
            <li><a href="/nutrition" class="{{if eq .CurrentPage "/nutrition"}}active{{end}}"><span class="nav-icon">🥗</span><span class="nav-text">Diet & Nutrition</span></a></li>
            <li><a href="/medication" class="{{if eq .CurrentPage "/medication"}}active{{end}}"><span class="nav-icon">💊</span><span class="nav-text">Medications</span></a></li>
            <li><a href="/blog" class="{{if eq .CurrentPage "/blog"}}active{{end}}"><span class="nav-icon">👥</span><span class="nav-text">Education</span></a></li>
            <li><a href="/support" class="{{if eq .CurrentPage "/support"}}active{{end}}"><span class="nav-icon">🆘</span><span class="nav-text">Support Groups</span></a></li>
        </ul>
        <div class="sidebar-logout">
            <button onclick="Auth.logout()" class="logout-btn"><span class="nav-icon">🚪</span><span class="nav-text">Logout</span></button>
        </div>
    </nav>
</aside>

<script>
// Sidebar toggle functionality
document.addEventListener('DOMContentLoaded', function() {
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    
    if (sidebarToggle && sidebar) {
        sidebarToggle.addEventListener('click', function() {
            sidebar.classList.toggle('collapsed');
            document.body.classList.toggle('sidebar-collapsed');
        });
    }
    
    // Mobile overlay click
    if (overlay) {
        overlay.addEventListener('click', function() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });
    }
});
</script>
{{end}}
