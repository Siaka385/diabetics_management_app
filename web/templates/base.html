<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Diawise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {{if .CSS}}<link rel="stylesheet" href="{{.CSS}}">{{end}}
</head>
<body>
    {{template "content" .}}
    
    <!-- Core Auth & Router Scripts -->
    <script src="/static/js/router.js"></script>
    <script src="/static/js/auth.js"></script>
    
    <!-- Page-specific scripts -->
    {{if .JS}}<script src="{{.JS}}"></script>{{end}}
    
    <script>
        // Initialize auth check on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Router automatically handles auth checks
            const authStatus = window.AppRouter.getAuthStatus();
            console.log('Auth Status:', authStatus);
        });
    </script>
</body>
</html>
